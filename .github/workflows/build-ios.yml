
name: Build VRASGFX iOS Native Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build iOS ARM64 dylib
        run: bash native/build-ios.sh

      - name: Verify dylib
        run: |
          file native/build/libvrasgfx_ios_probe.dylib
          xcrun lipo -info native/build/libvrasgfx_ios_probe.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: VRASGFX-iOS-Native-Probe-dylib
          path: native/build/libvrasgfx_ios_probe.dylib
          if-no-files-found: error
          retention-days: 14
