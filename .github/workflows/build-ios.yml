
name: Build VRASGFX iOS Native Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'build-ios.sh'
      - 'vrasgfx_ios_probe.c'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build iOS ARM64 dylib
        run: bash build-ios.sh

      - name: Verify dylib
        run: |
          file build/libvrasgfx_ios_probe.dylib
          xcrun lipo -info build/libvrasgfx_ios_probe.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: VRASGFX-iOS-Native-Probe-dylib
          path: build/libvrasgfx_ios_probe.dylib
          if-no-files-found: error
          retention-days: 14
